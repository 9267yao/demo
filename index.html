// ================ 推演主流程 ================
function validateForm(method) {
  var prev = document.querySelectorAll('.form-group label.error');
  for (var i=0;i<prev.length;i++) prev[i].classList.remove('error');
  var frames = document.querySelectorAll('.form-group.error-frame');
  for (var j=0;j<frames.length;j++) frames[j].classList.remove('error-frame');
  var ok = true, reqIds = [];
  // 所问何事（所有方法必填）
  var qEl = document.getElementById('f_question');
  if (qEl && !qEl.value.trim()) {
    var qGrp = qEl.closest('.form-group');
    if (qGrp.querySelector('label')) qGrp.querySelector('label').classList.add('error');
    qGrp.classList.add('error-frame');
    ok = false;
  }
  if (method === '八字') reqIds = ['f_year','f_month','f_day'];
  else if (method === '择日') reqIds = ['f_zy_year','f_zy_month','f_zy_day'];
  for (var k=0;k<reqIds.length;k++){
    var input = document.getElementById(reqIds[k]);
    if (input && !input.value) {
      var grp = input.closest('.form-group');
      if (grp.querySelector('label')) grp.querySelector('label').classList.add('error');
      grp.classList.add('error-frame');
      ok = false;
    }
  }
  if (method === '六爻' && currentInput.yaoMode === 'manual') {
    var inputs = document.querySelectorAll('.yao-input');
    for (var m=0;m<6;m++){
      if (inputs[m] && inputs[m].value === '') {
        var g2 = inputs[m].closest('.form-group');
        if (g2.querySelector('label')) g2.querySelector('label').classList.add('error');
        g2.classList.add('error-frame');
        ok = false;
      }
    }
  }
  return ok;
}
document.addEventListener('input', function(e){
  var el = e.target;
  if (el && el.classList && el.classList.contains('form-control')) {
    var grp = el.closest('.form-group');
    if (grp) {
      var label = grp.querySelector('label');
      if (label) label.classList.remove('error');
      grp.classList.remove('error-frame');
    }
  }
});
function runInfer() {
  if (!validateForm(currentMethod)) return;
  var question = val('f_question') || '';
  var gender = currentInput.gender || 1;
  var showDeriv = !!currentInput.showDerivation;
  var result;

  try {
    if (currentMethod === '八字') {
      var year = parseInt(val('f_year')), month = parseInt(val('f_month')), day = parseInt(val('f_day'));
      var hour = parseInt(val('f_hour')) || 0, minute = parseInt(val('f_minute')) || 0;
      var calendar = currentInput.calendar || '阳历';
      var city = val('f_city') || '';
      var cy = null; // 实时读取当前年份（engine 内部 new Date().getFullYear()）
      // 阳历无"闰月"概念，强制 false；阴历再按用户选择
      var isLeap = (calendar === '阴历') ? !!currentInput.isLeap : false;
      var info = baziPaipan(calendar, year, month, day, hour, minute, isLeap, city, true, false, gender, cy);
      // 排盘警告（如闰月不存在已自动降级）→ 弹出轻提示
      if (info && info.warnings && info.warnings.length) {
        setTimeout(function () { alert('⚠️ ' + info.warnings.join('\n')); }, 50);
      }
      result = doInfer('八字', question, gender, showDeriv, info, 'bazi');
    } else if (currentMethod === '六爻') {
      var tosses = null;
      if (currentInput.yaoMode === 'manual') {
        tosses = [];
        var inputs = document.querySelectorAll('.yao-input');
        for (var i = 0; i < 6; i++) {
          var v = parseInt(inputs[i].value);
          if (isNaN(v) || v < 0 || v > 3) { alert('第'+(i+1)+'爻请填0-3'); return; }
          tosses.push(v);
        }
      }
      var pan = liuyaoPaipan(tosses, gender, question);
      result = doInfer('六爻', question, gender, showDeriv, pan, 'liuyao');
    } else if (currentMethod === '塔罗') {
      var spread = currentInput.spread || 'single';
      var pan = tarotDraw(spread, null, gender);
      result = doInfer('塔罗', question, gender, showDeriv, pan, 'tarot');
    } else if (currentMethod === '择日') {
      var zy = parseInt(val('f_zy_year')), zm = parseInt(val('f_zy_month')), zd = parseInt(val('f_zy_day'));
      var zh = parseInt(val('f_zy_hour')) || 12;
      var szy = parseInt(val('f_sz_year'))||null, szm = parseInt(val('f_sz_month'))||null, szd = parseInt(val('f_sz_day'))||null;
      var szCal = currentInput.sz_calendar || '阳历';
      var szIsLeap = (szCal === '阴历') ? !!currentInput.sz_isLeap : false;
      if (!zy||!zm||!zd) return;
      var pan = zheriPaipan(zy, zm, zd, zh, 0, gender, question, szy, szm, szd, szCal, szIsLeap);
      result = doInfer('择日', question, gender, showDeriv, pan, 'zheri');
    }
  } catch (e) {
    alert('推演出错：' + e.message);
    console.error(e);
    return;
  }

  // 保存历史
  saveHistory(result);

  // 渲染
  document.getElementById('resultContent').innerHTML = renderResult(result, showDeriv);
  navigateTo('page-result');
}

function doInfer(method, question, gender, showDeriv, pan, kind) {
  var features = pan.features || (pan.info && pan.info.features) || {};
  // 候选规则：全部该方式规则参与，由条件本身严格过滤
  // （topic仅是规则库的组织分类——六爻的用神/动变/世应、八字的财运/事业等，
  //   不是用户问题维度，做门控会导致候选集过小甚至为空）
  var methodRules = ALL_RULES.filter(function(r){ return r.method === method && r.status === 1; });
  var candidates = methodRules;

  var hits = candidates.filter(function(r){ return matchAllConditions(r.conditions, features); });
  var resolved = resolveConflicts(hits);
  var duanyus = generateDuanyuList(resolved, method + '断');

  // 构造推导步骤
  if (showDeriv) {
    var panText = '';
    if (kind === 'bazi') panText = baziPanToText(pan);
    else if (kind === 'liuyao') panText = liuyaoPanToText(pan);
    else if (kind === 'tarot') panText = tarotPanToText(pan);
    else if (kind === 'zheri') panText = zheriPanToText(pan);

    duanyus.forEach(function(dy){
      var matchedRules = resolved.filter(function(r){ return dy.matched_rule_ids.indexOf(r.rule_id) >= 0; });
      var matchLines = matchedRules.map(function(r){
        var lines = ['规则 ' + r.rule_id + '（权威等级' + r.priority + '）：'];
        r.conditions.forEach(function(c){ lines.push('  ' + describeCondition(c, features)); });
        return lines.join('\n');
      });
      var evLines = dy.evidences.map(function(ev){ return '《' + ev.book + '·' + ev.chapter + '》曰：「' + ev.text + '」'; });
      dy.derivation = [
        {step:'占卜方式', detail: method + '（' + (gender===1?'男命':'女命') + '）'},
        {step:'盘象', detail: panText},
        {step:'规则匹配', detail: matchLines.length ? matchLines.join('\n') : '本问事类别下无完全命中规则'},
        {step:'典据溯源', detail: evLines.length ? evLines.join('\n') : '无典据'},
        {step:'结论', detail: dy.text + '（置信度' + Math.round(dy.confidence*100) + '%）'},
      ];
    });
  }

  // pan_view
  var panView = buildPanView(kind, pan);

  // 白话解读（结合所问之事 + 性别）
  var pt = plain.plainTalk(method, question, gender, pan);

  return {
    method: method, topic: pt.theme.key === 'general' ? '' : pt.theme.label, question: question, gender: gender,
    sizi: kind === 'bazi' ? pan.sizi : '',
    duanyus: duanyus, total: duanyus.length, panView: panView,
    showDerivation: showDeriv,
    plainTalk: pt.text, plainSummary: pt.summary || '', themeLabel: pt.theme.label,
  };
}

function locateBaziTopic(question) {
  var q = question || '';
  var map = {'事业':['事业','工作','求职','升职','功名'],'财运':['财运','财','钱','收入','生意','买卖'],
    '感情':['感情','婚姻','恋爱','姻缘','桃花'],'健康':['健康','病','疾','身体'],
    '性情':['性情','性格','脾气'],'学业':['学业','考试','读书','学习']};
  for (var t in map) { for (var i=0;i<map[t].length;i++) { if (q.indexOf(map[t][i])>=0) return t; } }
  return '';
}

function buildPanView(kind, pan) {
  var v = { kind: kind };
  if (kind === 'bazi') {
    v.sizi = pan.sizi; v.calendar = pan.calendar; v.solarDate = pan.solarDate; v.lunarDate = pan.lunarDate;
    v.shichen = pan.shichen; v.nayin = pan.nayin; v.shishen = pan.shishen;
    v.wangshuai = pan.wangshuai; v.yongshenHint = pan.yongshenHint;
    v.qiyunAge = pan.qiyunAge; v.qiyunYear = pan.qiyunYear; v.qiyunForward = pan.qiyunForward;
    v.dayun = pan.dayun; v.tstAdjust = pan.tstAdjust;
  } else if (kind === 'liuyao') {
    v.guaName = pan.guaName; v.bianGuaName = pan.bianGuaName; v.gong = pan.gong; v.gongWuxing = pan.gongWuxing;
    v.shiPos = pan.shiPos; v.yingPos = pan.yingPos; v.yongshen = pan.yongshen;
    v.yongshenYaos = pan.yongshenYaos; v.dongYaos = pan.dongYaos; v.yaoLines = pan.yaoLines;
  } else if (kind === 'tarot') {
    v.spread = pan.spread; v.cards = pan.cards; v.majorCount = pan.features.majorCount;
    v.minorCount = pan.features.minorCount; v.uprightCount = pan.features.uprightCount;
    v.reversedCount = pan.features.reversedCount; v.suitCounts = pan.features.suitCounts;
    v.tags = [];
    if (pan.features.hasDominantSuit) v.tags.push(pan.features.dominantSuit+'独多');
    if (pan.features.hasTransitionDense) v.tags.push('转变牌密集');
    if (pan.features.hasLightDense) v.tags.push('光明牌密集');
    if (pan.features.anySuitMissing) v.tags.push('缺花色');
    if (pan.features.hasCourtCard) v.tags.push('有宫廷牌');
  } else if (kind === 'zheri') {
    v.shixiang = pan.shixiang; v.targetDate = pan.targetDate; v.targetGanzhi = pan.targetGanzhi;
    v.zhixing = pan.zhixing; v.tianShen = pan.tianShen; v.tianShenLuck = pan.tianShenLuck;
    v.yiList = pan.yiList; v.jiList = pan.jiList; v.jishen = pan.jishen; v.xiongsha = pan.xiongsha;
    v.chongDesc = pan.chongDesc; v.shaFang = pan.shaFang; v.xiu = pan.xiu;
    v.isYuepo = pan.isYuepo; v.isSifei = pan.isSifei; v.isSijue = pan.isSijue;
    v.hasDeHe = pan.hasDeHe; v.chongShizhuDay = pan.chongShizhuDay;
    v.chongShizhuYear = pan.chongShizhuYear; v.haiShizhu = pan.haiShizhu; v.xingShizhu = pan.xingShizhu;
  }
  return v;
}

// ================ 结果渲染 ================
function renderResult(result, showDeriv) {
  var html = '';
  // 第一部分：先出示卦象/牌面/命盘（原始盘面先行展示）
  html += renderPanView(result.panView);
  // 第二部分：结论解读（结合所问之事）
  if (result.plainTalk) {
    html += '<div class="plain-card"><div class="plain-title">📋 结论解读</div><div class="plain-text">' + esc(result.plainTalk) + '</div></div>';
  }
  if (!result.duanyus || !result.duanyus.length) {
    return html + '<div class="empty-result"><div class="icon">📜</div><div>当前规则库未命中</div><div style="font-size:12px;margin-top:6px">所问之事或盘象暂无完全匹配的典籍规则</div></div>' + disclaimerHtml();
  }
  // 第三部分：典籍断语区（默认折叠，按钮切换）
  var methodDuanName = { '八字':'八字断', '六爻':'六爻断', '塔罗':'塔罗断', '择日':'择日断' }[result.method] || '典籍断';
  html += '<button class="duanyu-fold-btn" id="duanyuFoldBtn" onclick="toggleDuanyu()"><span class="fold-arrow" id="duanyuArrow">▸</span><span id="duanyuBtnText">展开' + methodDuanName + '（' + result.duanyus.length + '条）</span></button>';
  html += '<div class="duanyu-list" id="duanyuList" style="display:none;">';
  result.duanyus.forEach(function(dy, idx){
    html += '<div class="duanyu-card">';
    html += '<div class="duanyu-title">' + dy.title + '</div>';
    html += '<div class="duanyu-text">' + esc(dy.text) + '</div>';
    if (showDeriv && dy.derivation && dy.derivation.length) {
      // 选择了"展示过程"：分析过程默认展开直接展示（可点击收起）
      html += '<div class="derivation-toggle" onclick="toggleDeriv(this)"><span>收起分析过程</span><span>▾</span></div>';
      html += '<div class="derivation-body show">';
      dy.derivation.forEach(function(s){
        html += '<strong>' + s.step + '</strong>\n' + esc(s.detail) + '\n\n';
      });
      html += '</div>';
    }
    if (showDeriv && dy.evidences && dy.evidences.length) {
      dy.evidences.forEach(function(ev){
        html += '<div class="evidence-item">《' + esc(ev.book) + '·' + esc(ev.chapter) + '》：「' + esc(ev.text) + '」</div>';
      });
    }
    html += '<div class="duanyu-confidence">置信度 ' + Math.round(dy.confidence*100) + '%　规则：' + dy.matched_rule_ids.join(', ') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += disclaimerHtml();
  return html;
}

function renderPanView(pv) {
  if (!pv || !pv.kind) return '';
  var html = '<div class="pan-view"><div class="pan-view-title">命盘概览</div>';
  if (pv.kind === 'bazi') {
    html += pvRow('四柱', pv.sizi);
    html += pvRow('日主', (pv.wangshuai.riGan||'') + '（' + (pv.wangshuai.riWuxing||'') + '）　旺衰：' + pv.wangshuai.level);
    html += pvRow('起运', pv.qiyunAge + '岁（' + pv.qiyunYear + '年）' + (pv.qiyunForward?'顺行':'逆行'));
    html += pvRow('用神', pv.yongshenHint);
    if (pv.tstAdjust && pv.tstAdjust.enabled) html += pvRow('真太阳时', pv.tstAdjust.originalTime + '→' + pv.tstAdjust.adjustedTime + '（' + pv.tstAdjust.adjustMinutes + '分）');
    if (pv.dayun && pv.dayun.length) {
      var dayunStr = pv.dayun.slice(0,4).map(function(d){ return d.ganzhi + '(' + d.ganShishen + ')'; }).join(' ');
      html += pvRow('大运', dayunStr, true);
    }
  } else if (pv.kind === 'liuyao') {
    html += pvRow('本卦', pv.guaName + '（' + pv.gong + '宫·' + pv.gongWuxing + '）');
    if (pv.bianGuaName && pv.bianGuaName !== pv.guaName) html += pvRow('变卦', pv.bianGuaName);
    html += pvRow('世应', '世' + pv.shiPos + '爻　应' + pv.yingPos + '爻');
    html += pvRow('用神', pv.yongshen + '（在' + (pv.yongshenYaos.length?pv.yongshenYaos.join(','):'无') + '爻）');
    if (pv.dongYaos && pv.dongYaos.length) html += pvRow('动爻', '第' + pv.dongYaos.join(',') + '爻');
    if (pv.yaoLines) {
      html += '<div class="pan-view-row full"><div class="k">六爻</div><div class="v">';
      for (var i = pv.yaoLines.length-1; i >= 0; i--) {
        var y = pv.yaoLines[i];
        var sym = y.yinYang === '阳' ? '━━━━━' : '━━　━━';
        var flags = [];
        if (y.isShi) flags.push('世');
        if (y.isYing) flags.push('应');
        if (y.isDong) flags.push('○动');
        html += '<div class="yao-line"><span class="yao-pos">' + y.position + '</span><span class="yao-symbol">' + sym + '</span>' + y.ganzhi + '(' + y.liuqin + ') ' + flags.join(' ') + '</div>';
      }
      html += '</div></div>';
    }
  } else if (pv.kind === 'tarot') {
    var spreadNames = {single:'单牌阵',three:'三牌阵',celtic:'凯尔特十字阵'};
    html += pvRow('牌阵', spreadNames[pv.spread] || pv.spread);
    if (pv.cards && pv.cards.length) {
      html += '<div class="pan-block">';
      pv.cards.forEach(function(c){
        var revCls = c.isReversed ? 'down' : 'up';
        var revTxt = c.isReversed ? '逆' : '正';
        var tag = cardIsMajor(c.card) ? '<span class="tag tag-major">大阿卡纳</span>' : '<span class="tag tag-suit">' + cardSuit(c.card) + '</span>';
        html += '<div class="tarot-card-item"><span class="tarot-card-pos">' + c.position + '</span><span class="tarot-card-name">' + c.card + ' ' + tag + '</span><span class="tarot-card-rev ' + revCls + '">' + revTxt + '</span></div>';
      });
      html += '</div>';
    }
    html += pvRow('统计', '大阿卡纳' + pv.majorCount + ' / 小阿卡纳' + pv.minorCount + ' / 正位' + pv.uprightCount + ' / 逆位' + pv.reversedCount, true);
    if (pv.tags && pv.tags.length) html += pvRow('特征', pv.tags.map(function(t){return '<span class="tag tag-flag">'+t+'</span>';}).join(''), true);
  } else if (pv.kind === 'zheri') {
    html += pvRow('择吉之日', pv.targetDate + '（' + pv.targetGanzhi + '日）');
    html += pvRow('事项', pv.shixiang);
    html += pvRow('建除', pv.zhixing + '（' + pv.tianShen + '·' + pv.tianShenLuck + '）');
    html += pvRow('宜', pv.yiList.length ? pv.yiList.join('、') : '诸事不宜', true);
    html += pvRow('忌', pv.jiList.length ? pv.jiList.join('、') : '诸事皆宜', true);
    if (pv.chongDesc) html += pvRow('冲煞', pv.chongDesc + '　煞：' + pv.shaFang);
    var flags = [];
    if (pv.isYuepo) flags.push('<span class="tag tag-flag">月破日</span>');
    if (pv.isSifei) flags.push('<span class="tag tag-flag">四废日</span>');
    if (pv.isSijue) flags.push('<span class="tag tag-flag">四绝日</span>');
    if (pv.hasDeHe) flags.push('<span class="tag tag-good">天德月德并临</span>');
    if (pv.chongShizhuDay) flags.push('<span class="tag tag-flag">冲事主日支</span>');
    if (pv.chongShizhuYear) flags.push('<span class="tag tag-flag">冲事主本命</span>');
    if (pv.haiShizhu) flags.push('<span class="tag tag-flag">害事主</span>');
    if (pv.xingShizhu) flags.push('<span class="tag tag-flag">刑事主</span>');
    if (flags.length) html += pvRow('神煞判定', flags.join(''), true);
  }
  html += '</div>';
  return html;
}

function pvRow(k, v, full) { return '<div class="pan-view-row' + (full ? ' full' : '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }
function disclaimerHtml() { return '<div class="disclaimer">— 以上推演依据典籍规则，仅供娱乐，请勿用于重大决策 —</div>'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

function toggleDeriv(el) {
  var body = el.nextElementSibling;
  var open = body.classList.toggle('show');
  el.querySelector('span:last-child').textContent = open ? '▾' : '▸';
  el.querySelector('span:first-child').textContent = open ? '收起分析过程' : '查看分析过程';
}

// 折叠/展开典籍断语区（默认折叠）
function toggleDuanyu() {
  var list = document.getElementById('duanyuList');
  var btn = document.getElementById('duanyuFoldBtn');
  var arrow = document.getElementById('duanyuArrow');
  var text = document.getElementById('duanyuBtnText');
  if (!list) return;
  var isOpen = list.style.display !== 'none';
  if (isOpen) {
    list.style.display = 'none';
    btn.classList.remove('expanded');
    arrow.classList.remove('open');
    // 恢复按钮文案：从"收起X断"变回"展开X断（N条）"
    text.textContent = text.textContent.replace(/^收起(.+?)（/, '展开$1（');
  } else {
    list.style.display = 'block';
    btn.classList.add('expanded');
    arrow.classList.add('open');
    text.textContent = text.textContent.replace(/^展开(.+?)（/, '收起$1（');
  }
}

// ================ 历史记录 ================
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; }
}
function saveHistory(result) {
  if (!result || !result.method) return;
  var now = new Date();
  var pad = function(n){return String(n).padStart(2,'0');};
  var timeStr = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  // 摘要优先取白话结论首行（plainSummary），其次取典籍断语首条
  var firstText = '（未命中规则）';
  if (result.plainSummary) {
    firstText = result.plainSummary;
  } else if (result.duanyus && result.duanyus.length) {
    firstText = result.duanyus[0].text;
  }
  var record = { id: Date.now(), time: timeStr, method: result.method, topic: result.topic, gender: result.gender, sizi: result.sizi||'', summary: firstText, total: result.total||0, data: result };
  var list = loadHistory();
  list.unshift(record);
  if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch(e){}
}
function openHistory() {
  renderHistoryList();
  navigateTo('page-history');
}
function renderHistoryList() {
  var list = loadHistory();
  var clearBtn = document.getElementById('clearHistoryBtn');
  if (clearBtn) clearBtn.style.display = list.length ? 'block' : 'none';
  var content = document.getElementById('historyContent');
  if (!list.length) {
    content.innerHTML = '<div class="empty-result"><div class="icon">📜</div><div>暂无历史记录</div></div>';
    return;
  }
  var html = list.map(function(r){
    var genderStr = r.gender === 1 ? '男' : '女';
    var topicStr = r.topic ? r.topic + ' · ' : '';
    return '<div class="history-item" onclick="viewHistoryDetail(' + r.id + ')">' +
      '<button class="history-del" onclick="event.stopPropagation();deleteHistory(' + r.id + ')">×</button>' +
      '<div class="history-item-head"><span class="history-item-method">' + esc(r.method) + ' · ' + genderStr + '</span><span class="history-item-time">' + esc(r.time) + '</span></div>' +
      '<div class="history-item-summary">' + topicStr + '命中' + r.total + '条 · ' + esc(r.summary) + '</div>' +
      (r.sizi ? '<div style="font-size:11px;color:var(--ink-faint);margin-top:4px">' + esc(r.sizi) + '</div>' : '') +
      '</div>';
  }).join('');
  content.innerHTML = html;
}
function viewHistoryDetail(id) {
  var list = loadHistory();
  var record = list.find(function(r){return r.id===id;});
  if (!record) return;
  document.getElementById('resultContent').innerHTML = renderResult(record.data, record.data.showDerivation);
  navigateTo('page-result');
}
function deleteHistory(id) {
  var list = loadHistory().filter(function(r){return r.id!==id;});
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch(e){}
  renderHistoryList();
}
function clearAllHistory() {
  if (!confirm('确定清空全部历史记录？')) return;
  try { localStorage.removeItem(HISTORY_KEY); } catch(e){}
  renderHistoryList();
}

// ================ 灵感笔记 ================
function loadInspiration() {
  try { var d = JSON.parse(localStorage.getItem(INSPIRATION_KEY) || '{}'); return {text:d.text||'', time:d.time||''}; } catch(e){ return {text:'',time:''}; }
}
function openInspiration() {
  var d = loadInspiration();
  var ta = document.getElementById('inspirationText');
  ta.value = d.text;
  document.getElementById('inspirationSaveTime').textContent = d.time ? '已保存：' + d.time : '未保存';
  navigateTo('page-inspiration');
}
function onInspirationInput() {
  var text = document.getElementById('inspirationText').value;
  clearTimeout(_inspirationTimer);
  _inspirationTimer = setTimeout(saveInspiration, 2000);
}
function saveInspiration() {
  var text = document.getElementById('inspirationText').value;
  var now = new Date();
  var pad = function(n){return String(n).padStart(2,'0');};
  var timeStr = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  try { localStorage.setItem(INSPIRATION_KEY, JSON.stringify({text:text, time:timeStr})); document.getElementById('inspirationSaveTime').textContent = '已保存：' + timeStr; }
  catch(e){ alert('保存失败'); }
}
